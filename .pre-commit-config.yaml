# Equivalent of the Python repo's hooks: lint+format, no commits to main, hygiene, no secrets.
# Install once: `pre-commit install` (needs https://pre-commit.com).
repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.13
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.5.13"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: trailing-whitespace
        exclude: ^tests/fixtures/
      - id: check-json
        exclude: ^(tsconfig\.json|biome\.json)$
      - id: check-yaml
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
