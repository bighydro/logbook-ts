name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    # A run takes two to three minutes; one held by a hung test ends here, with its log, not at six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: the built binary verifies the vendored sample
        run: node dist/bin.js verify tests/fixtures/sample-logbook
      - name: the built binary shows a day of each show fixture, a range, a profile and JSON
        run: |
          node dist/bin.js show tests/fixtures/show-sample --day 2026-03-14
          node dist/bin.js show tests/fixtures/profiles-sample --day 2026-03-04
          node dist/bin.js show tests/fixtures/sample-logbook --since 2026-03-07 --profile note/v1,event/v1
          node dist/bin.js show tests/fixtures/sample-logbook --day 2026-03-08 --json
      - name: the built binary reads a day of each day fixture, as text and as JSON
        run: |
          node dist/bin.js day tests/fixtures/day-sample 2026-04-06
          node dist/bin.js day tests/fixtures/day-sample 2026-04-08 --json
          node dist/bin.js day tests/fixtures/demo-sample 2026-06-15
      - name: the built binary counts each fixture and reports where its sources went quiet
        run: |
          node dist/bin.js stats tests/fixtures/sample-logbook
          node dist/bin.js stats tests/fixtures/profiles-sample --json
          node dist/bin.js sources tests/fixtures/show-sample
          node dist/bin.js sources tests/fixtures/sample-logbook --gaps --since 2026-03-05
      - name: the built binary derives the trips, the countries and the nights of the trips fixtures and of the demo record, whole, a year and a range, as text and as JSON
        run: |
          node dist/bin.js trips tests/fixtures/trips-sample
          node dist/bin.js trips tests/fixtures/trips-sample --year 2026 --json
          node dist/bin.js rollup countries tests/fixtures/trips-sample --since 2025-12-31 --until 2026-01-06
          node dist/bin.js rollup countries tests/fixtures/trips-sample --json
          node dist/bin.js rollup nights tests/fixtures/nights-sample
          node dist/bin.js rollup nights tests/fixtures/nights-sample --year 2026 --json
          node dist/bin.js trips tests/fixtures/demo-seed1
          node dist/bin.js rollup nights tests/fixtures/demo-seed1 --since 2026-06-08 --until 2026-06-20
      - name: the built binary reads the days of the demo record, whole and a range, as text and as JSON Lines
        run: |
          node dist/bin.js days tests/fixtures/demo-seed1
          node dist/bin.js days tests/fixtures/demo-seed1 --from 2026-06-14 --to 2026-06-21 --json
      - name: the built binary lists the people of the demo record, whole and one year, as text and as JSON
        run: |
          node dist/bin.js people tests/fixtures/demo-seed1
          node dist/bin.js people tests/fixtures/demo-seed1 --year 2026 --json
      - name: the built binary reads RFC 0037's and RFC 0038's lines under their flags, a day shown and read back, as text and as JSON
        env: { LOGBOOK_TS_FLAGS: "rfc0037,rfc0038" }
        run: |
          node dist/bin.js show tests/fixtures/rfc0037-0038-sample --day 2026-10-06
          node dist/bin.js day tests/fixtures/rfc0037-0038-sample 2026-10-06
          node dist/bin.js day tests/fixtures/rfc0037-0038-sample 2026-10-06 --json
          node dist/bin.js status list tests/fixtures/rfc0037-0038-sample org
          node dist/bin.js status list tests/fixtures/rfc0037-0038-sample asset --json

  conformance:
    # SPEC section 6, against the fixture as published at the spec's own revision: the 32-line
    # samples of RFC 0034 (main at 3092b60, 2026-10-08; a tag will follow), Level 1 and, keyless,
    # Level 2.
    runs-on: ubuntu-latest
    env:
      SPEC_REV: 3092b606955566bdf46b8b1f03af6f14168f20c8
      EXPECTED_HEAD: 58bfa9e704e3388d44d74e63f1d84765d24df79e92fce3b522fbef53b765d3df
      EXPECTED_LINES: "32"
      EXPECTED_SEALED_HEAD: 0ab4c3e79bacc9a7c19d074094e81d1674fdf6967ceaf0d1711679e3c11481db
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: clone the spec at the revision
        run: |
          git clone --filter=blob:none https://github.com/bighydro/logbook spec
          git -C spec checkout --quiet "$SPEC_REV"
      - name: verify prints the expected head
        run: |
          set -euo pipefail
          out=$(node dist/bin.js verify spec/conformance/sample-logbook)
          echo "$out"
          test "$out" = "valid — ${EXPECTED_LINES} lines, head ${EXPECTED_HEAD}"
          test "$(jq -r .head spec/conformance/expected.json)" = "$EXPECTED_HEAD"
          test "$(jq -r .seq spec/conformance/expected.json)" = "$EXPECTED_LINES"
      - name: verify prints the expected head of the sealed sample, keyless (Level 2, rule 4)
        run: |
          set -euo pipefail
          out=$(node dist/bin.js verify spec/conformance/sample-logbook-sealed)
          echo "$out"
          test "$out" = "valid — ${EXPECTED_LINES} lines, head ${EXPECTED_SEALED_HEAD}"
          test "$(jq -r .head spec/conformance/expected-sealed.json)" = "$EXPECTED_SEALED_HEAD"
      - name: appending one note to a copy still verifies
        run: |
          set -euo pipefail
          cp -R spec/conformance/sample-logbook copy
          node dist/bin.js add copy "second implementation, same chain"
          out=$(node dist/bin.js verify copy)
          echo "$out"
          case "$out" in "valid — $((EXPECTED_LINES + 1)) lines, head "*) ;; *) echo "unexpected: $out"; exit 1;; esac
      - name: a tampered copy is refused
        run: |
          set -euo pipefail
          sed -i 's/"accuracy_m": 12/"accuracy_m": 13/' copy/logbook/2026/03.jsonl
          if node dist/bin.js verify copy; then echo "tampering was not detected"; exit 1; fi

  conformance-main:
    # The fixture as it stands on the spec repo's main: verify must print whatever expected.json
    # there says, and the vendored copy must still be that fixture, so a regenerated sample is
    # noticed here and pulled, not discovered later.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: clone the spec at main
        run: git clone --depth 1 https://github.com/bighydro/logbook spec
      - name: verify prints the head in conformance/expected.json at main
        run: |
          set -euo pipefail
          expected="valid — $(jq -r .seq spec/conformance/expected.json) lines, head $(jq -r .head spec/conformance/expected.json)"
          out=$(node dist/bin.js verify spec/conformance/sample-logbook)
          echo "$out"
          test "$out" = "$expected"
      - name: the vendored fixture is the one on main
        run: |
          set -euo pipefail
          if ! diff -r --exclude='expected-*' spec/conformance/sample-logbook tests/fixtures/sample-logbook || ! diff spec/conformance/expected.json tests/fixtures/expected.json || ! diff -r spec/conformance/sample-logbook-sealed tests/fixtures/sample-logbook-sealed || ! diff spec/conformance/expected-sealed.json tests/fixtures/expected-sealed.json; then
            echo "::error::conformance/ moved on bighydro/logbook main; copy sample-logbook and expected.json into tests/fixtures and update the conformance job's SPEC_REV, EXPECTED_HEAD and EXPECTED_LINES"
            exit 1
          fi

  cross-impl:
    # The reference implementation (Python) and this one must print the same day, count the same
    # record and derive the same trips: tests/cross-impl.test.ts runs `logbook show` of the reference at
    # the commit `REFERENCE` names on every expected-show fixture (the two synthetic records and the
    # conformance sample), `logbook day` on every expected-day fixture and on three days of the
    # reference's demo record, `logbook stats` and `logbook sources --gaps` on the fixtures and on the
    # demo record, `logbook trips`, `logbook rollup countries` and `logbook rollup nights` on every
    # expected-trips fixture — the two probe records, the two day fixtures, the conformance sample and
    # the vendored `logbook demo --seed 1` — and on the whole seed-7 demo record, and `logbook days` and
    # `logbook people` on every expected-days and expected-people fixture — the conformance sample and
    # the seed-1 demo among them — and diffs them against ours and against the vendored expected files;
    # under the draft flags, `logbook show`, `day`, `people` and `days` on the RFC 0036 sample and on the
    # record the reference wrote with RFC 0037's and RFC 0038's lines (rfc0037-0038-sample); and
    # tests/cross-impl-entities.test.ts runs RFC 0037's validators, tier rules and `status list` of the
    # reference beside ours on payload variants, on synthetic records and on that record.
    #
    # Since the catch-up of 2026-10-18 `REFERENCE` is b82a11c4, the reference's release 0.7.0 (tag
    # v0.7.0); the file holds the hash alone, as the steps below read it. The cases of
    # tests/superseded-cases.ts, speakers-cases.ts and marks-cases.ts, and a day the reference signs and
    # signs again, run the reference beside ours as well.
    #
    # The reference is the one commit `REFERENCE` names, not its moving main, so a PR is red for what
    # it changes and not for what the reference merged since: a catch-up PR moves `REFERENCE` and
    # re-captures the expected files with tests/fixtures/capture-expected-*.mjs. drift.yml runs these
    # same steps against the reference's main, daily, to show how far it has moved.
    runs-on: ubuntu-latest
    # A run takes about four minutes; one held by a hung reference ends here, with its log.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: fetch the reference at the commit REFERENCE names
        run: |
          set -euo pipefail
          git init ref
          git -C ref fetch --depth 1 https://github.com/bighydro/logbook "$(cat REFERENCE)"
          git -C ref checkout -q FETCH_HEAD
          test "$(git -C ref rev-parse HEAD)" = "$(cat REFERENCE)"
      - uses: astral-sh/setup-uv@v7
      - name: install the reference
        run: uv sync --project ref
      - name: both implementations take the writer lock and refuse and repair a tail past logbook.json alike
        run: LOGBOOK_REF="$PWD/ref" pnpm vitest run tests/cross-impl-writer.test.ts
      - name: both implementations print the same day and count the same record
        if: ${{ !cancelled() }}
        run: LOGBOOK_REF="$PWD/ref" pnpm vitest run tests/cross-impl.test.ts tests/profiles.test.ts tests/cross-impl-entities.test.ts
